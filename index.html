<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eyüp Ecmel Acat - Solopreneur</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            background-color: #000000; 
            overflow-x: hidden;
        }
        .pdf-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
        }
        object {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="pdf-container">
        <!-- PDF tarayıcı menülerini gizleyen gelişmiş yükleme parametreleri (#toolbar=0) -->
        <object data="index.pdf#toolbar=0&navpanes=0&scrollbar=1" type="application/pdf">
            <iframe src="index.pdf#toolbar=0&navpanes=0&scrollbar=1" style="border: none; width: 100%; height: 100%;"></iframe>
        </object>
    </div>
</body>
</html>
