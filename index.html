<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eyüp Ecmel Acat - Solopreneur</title>
    <style>
        /* Tüm tarayıcı boşluklarını sıfırlayıp tam ekran yapıyoruz */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%;
            background-color: #000000; 
            overflow: hidden; 
        }
        /* PDF'i telefonda ve masaüstünde indirtmeden açan kapsayıcı */
        .pdf-viewer { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
</head>
<body>

    <!-- Google Docs Viewer kullanarak PDF'i indirtmeden direkt UI olarak açıyoruz -->
    <iframe class="pdf-viewer" 
            src="https://google.com">
    </iframe>

</body>
</html>
